<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#f8fafc;margin:0;color:#17212b}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:18px;margin:16px 0}.hidden{display:none}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}button,.btn{background:#0f766e;color:white;border:0;padding:10px 14px;border-radius:10px;font-weight:800;text-decoration:none;cursor:pointer}.ghost{background:white;color:#17212b;border:1px solid #ccc}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border-top:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:10px}.muted{color:#64748b}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:white;color:#17212b;border:1px solid #ccc}.active{background:#17212b;color:white}@media(max-width:700px){.row{grid-template-columns:1fr}.item{display:block}.item button{margin-top:8px}}</style></head><body><div class="wrap"><div class="top"><b>ALL IN PROPERTIES — OWNER DASHBOARD</b><a class="btn ghost" href="/">Website</a></div><section id="login" class="card"><h1>Owner Login</h1><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button>Sign in</button><div id="loginStatus" class="muted"></div></form></section><section id="dash" class="hidden"><div class="tabs"><button class="tab active" data-tab="listings">Listings</button><button class="tab" data-tab="blocked">Blocked dates</button><button class="tab" data-tab="reservations">Reservations</button></div><div id="listingsTab"><div class="card"><div class="top"><div><h2>Listings</h2><div class="muted">Add and edit properties here.</div></div><button id="add">+ Add property</button></div><div id="list"></div></div><div id="editor" class="card hidden"><h2 id="editorTitle">Add property</h2><form id="propertyForm"><input type="hidden" name="id"><div class="row"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Location</label><input name="location"></div></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="row"><div class="field"><label>Nightly rate ($)</label><input name="nightly_rate" type="number" step=".01" required></div><div class="field"><label>Cleaning fee ($)</label><input name="cleaning_fee" type="number" step=".01" value="0"></div></div><div class="row"><div class="field"><label>Tax rate</label><input name="tax_rate" type="number" step=".0001" value=".07"></div><div class="field"><label>Max guests</label><input name="max_guests" type="number" value="1"></div></div><div class="row"><div class="field"><label>Bedrooms</label><input name="bedrooms" type="number"></div><div class="field"><label>Bathrooms</label><input name="bathrooms" type="number" step=".5"></div></div><div class="field"><label>Published?</label><select name="active"><option value="true">Yes</option><option value="false">No</option></select></div><button>Save property</button> <button type="button" id="cancel" class="ghost">Cancel</button><div id="propStatus" class="muted"></div></form></div></div><div id="blockedTab" class="hidden"><div class="card"><h2>Block dates</h2><form id="blockForm"><div class="field"><label>Property</label><select name="property_id"></select></div><div class="row"><div class="field"><label>Start</label><input name="start_date" type="date" required></div><div class="field"><label>End</label><input name="end_date" type="date" required></div></div><div class="field"><label>Reason</label><input name="reason"></div><button>Block dates</button></form></div><div class="card"><div id="blocks"></div></div></div><div id="reservationsTab" class="hidden"><div class="card"><div id="reservations"></div></div></div></section></div><script>let sb,token,props=[];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),authorization:`Bearer ${token}`};if(opt.body&&typeof opt.body!=='string'){opt.headers['content-type']='application/json';opt.body=JSON.stringify(opt.body)}let r=await fetch(path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function boot(){let c=await fetch('/api/config').then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabasePublishableKey);let {data:{session}}=await sb.auth.getSession();if(session){token=session.access_token;try{await enter()}catch{}}}$('#loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget);let {data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){$('#loginStatus').textContent=error.message;return}token=data.session.access_token;try{await enter()}catch(err){$('#loginStatus').textContent=err.message}};async function enter(){await api('/api/admin/me');$('#login').classList.add('hidden');$('#dash').classList.remove('hidden');await loadProps();await loadBlocks();await loadReservations()}async function loadProps(){let d=await api('/api/admin/properties');props=d.properties||[];$('#list').innerHTML=props.length?props.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.location||'')} · $${Number(p.nightly_rate||0).toFixed(2)}/night · ${p.active?'Published':'Hidden'}</div></div><div><button class="ghost edit" data-id="${p.id}">Edit</button> <button class="ghost toggle" data-id="${p.id}" data-active="${p.active}">${p.active?'Hide':'Publish'}</button></div></div>`).join(''):'<p class="muted">No listings yet.</p>';$$('.edit').forEach(b=>b.onclick=()=>edit(b.dataset.id));$$('.toggle').forEach(b=>b.onclick=async()=>{await api('/api/admin/properties/'+b.dataset.id,{method:'PATCH',body:{active:b.dataset.active!=='true'}});await loadProps()});$('#blockForm select[name=property_id]').innerHTML=props.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}$('#add').onclick=()=>{let f=$('#propertyForm');f.reset();f.id.value='';f.tax_rate.value='.07';f.max_guests.value='1';f.active.value='true';$('#editorTitle').textContent='Add property';$('#editor').classList.remove('hidden')};$('#cancel').onclick=()=>$('#editor').classList.add('hidden');function edit(id){let p=props.find(x=>x.id===id),f=$('#propertyForm');for(let k of ['id','name','location','description','nightly_rate','cleaning_fee','tax_rate','max_guests','bedrooms','bathrooms'])f[k].value=p[k]??'';f.active.value=String(!!p.active);$('#editorTitle').textContent='Edit property';$('#editor').classList.remove('hidden')}$('#propertyForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget),id=f.get('id'),body={name:f.get('name'),location:f.get('location')||null,description:f.get('description')||null,nightly_rate:Number(f.get('nightly_rate')||0),cleaning_fee:Number(f.get('cleaning_fee')||0),tax_rate:Number(f.get('tax_rate')||0),max_guests:Number(f.get('max_guests')||1),bedrooms:f.get('bedrooms')===''?null:Number(f.get('bedrooms')),bathrooms:f.get('bathrooms')===''?null:Number(f.get('bathrooms')),active:f.get('active')==='true'};try{await api(id?'/api/admin/properties/'+id:'/api/admin/properties',{method:id?'PATCH':'POST',body});$('#propStatus').textContent='Saved.';await loadProps();$('#editor').classList.add('hidden')}catch(err){$('#propStatus').textContent=err.message}};$('#blockForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget);await api('/api/admin/blocked-dates',{method:'POST',body:{property_id:f.get('property_id'),start_date:f.get('start_date'),end_date:f.get('end_date'),reason:f.get('reason')||null}});e.currentTarget.reset();await loadBlocks()};async function loadBlocks(){let d=await api('/api/admin/blocked-dates'),x=d.blockedDates||[];$('#blocks').innerHTML=x.length?x.map(b=>`<div class="item"><div>${esc(b.properties?.name||'')}<div class="muted">${b.start_date} → ${b.end_date} ${esc(b.reason||'')}</div></div><button class="ghost del" data-id="${b.id}">Remove</button></div>`).join(''):'<p class="muted">No blocked dates.</p>';$$('.del').forEach(b=>b.onclick=async()=>{await api('/api/admin/blocked-dates/'+b.dataset.id,{method:'DELETE'});await loadBlocks()})}async function loadReservations(){let d=await api('/api/admin/reservations'),x=d.reservations||[];$('#reservations').innerHTML=x.length?x.map(r=>`<div class="item"><div><b>${esc(r.guest_name)}</b><div class="muted">${esc(r.properties?.name||'')} · ${r.check_in} → ${r.check_out} · $${Number(r.total_amount||0).toFixed(2)} · ${esc(r.status)}</div></div></div>`).join(''):'<p class="muted">No reservations yet.</p>'}$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');for(let n of ['listings','blocked','reservations'])$('#'+n+'Tab').classList.toggle('hidden',n!==t.dataset.tab)});boot();</script></body></html>

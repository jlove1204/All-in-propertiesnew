<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All In Properties</title><style>body{font-family:system-ui;margin:0;color:#17212b}header{padding:18px 20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}a{color:inherit}.btn{padding:10px 14px;border:1px solid #ddd;border-radius:12px;text-decoration:none}.hero{padding:70px 20px;background:#f4f8f7}.wrap{max-width:1100px;margin:auto}.hero h1{font-size:clamp(42px,7vw,72px);margin:0}.hero p{color:#64748b;font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:40px 20px}.card{border:1px solid #ddd;border-radius:18px;padding:18px}.empty{grid-column:1/-1;text-align:center;padding:30px;border:1px dashed #bbb;border-radius:18px;color:#64748b}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">ALL IN PROPERTIES</div><a class="btn" href="/admin">Owner Login</a></header><section class="hero"><div class="wrap"><h1>Stay somewhere you’ll love.</h1><p>Direct Florida vacation rentals from All In Properties.</p></div></section><main class="wrap"><div id="grid" class="grid"><div class="empty">Loading listings…</div></div></main><script>const g=document.getElementById('grid');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));fetch('/api/properties').then(r=>r.json()).then(d=>{const p=d.properties||[];g.innerHTML=p.length?p.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><div>${esc(x.location||'Florida')}</div><p><b>$${Number(x.nightly_rate||0).toFixed(2)}</b> / night</p><p>Up to ${x.max_guests} guests</p></div>`).join(''):'<div class="empty"><b>No active listings yet.</b><br><br>Use Owner Login to add your first property.</div>'}).catch(()=>g.innerHTML='<div class="empty">Could not load listings.</div>');</script></body></html>
